<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYRA Refactoring Sprint Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;

        const SprintPlanner = () => {
            const [selectedSprint, setSelectedSprint] = useState(1);
            const [completedTasks, setCompletedTasks] = useState({});

            // Define all tasks with impact/effort scores
            const tasks = {
                backend: [
                    {
                        id: 'be-1',
                        title: 'Fix N+1 Queries (5 locations)',
                        impact: 'high',
                        effort: 'medium',
                        time: '4-6 hours',
                        sprint: 1,
                        files: ['store/views.py:221', 'store/signals.py:20', 'store/models.py:365,369', 'store/template_views.py:436'],
                        steps: [
                            'Add select_related for ForeignKey relationships',
                            'Add prefetch_related for reverse ForeignKey and M2M',
                            'Test with Django Debug Toolbar',
                            'Measure query count before/after'
                        ]
                    },
                    {
                        id: 'be-2',
                        title: 'Add Database Indexes',
                        impact: 'high',
                        effort: 'low',
                        time: '2-3 hours',
                        sprint: 1,
                        files: ['store/models.py', 'accounts/models.py', 'profiles/models.py'],
                        steps: [
                            'Identify frequently queried fields',
                            'Add indexes to Meta class',
                            'Generate migrations',
                            'Test query performance'
                        ]
                    },
                    {
                        id: 'be-3',
                        title: 'Refactor Long Functions',
                        impact: 'medium',
                        effort: 'high',
                        time: '8-12 hours',
                        sprint: 2,
                        files: ['store/views.py:406', 'store/serializers.py:215,329,424', 'store/emails.py:9,78,132'],
                        steps: [
                            'Create service layer classes',
                            'Extract business logic from views',
                            'Break 100+ line functions into 10-20 line methods',
                            'Write unit tests for each method'
                        ]
                    },
                    {
                        id: 'be-4',
                        title: 'Implement Service Layer Pattern',
                        impact: 'high',
                        effort: 'high',
                        time: '12-16 hours',
                        sprint: 3,
                        files: ['New: services/order_service.py', 'services/product_service.py', 'services/user_service.py'],
                        steps: [
                            'Create services directory',
                            'Build OrderService for checkout logic',
                            'Build ProductService for inventory',
                            'Refactor views to use services',
                            'Write comprehensive tests'
                        ]
                    },
                    {
                        id: 'be-5',
                        title: 'Add Soft Deletes & Audit Trail',
                        impact: 'medium',
                        effort: 'medium',
                        time: '6-8 hours',
                        sprint: 4,
                        files: ['utils/mixins.py (new)', 'store/models.py', 'profiles/models.py'],
                        steps: [
                            'Create AuditMixin abstract model',
                            'Add is_deleted and deleted_at fields',
                            'Create ActiveManager for filtering',
                            'Update views to use soft delete',
                            'Write migration strategy'
                        ]
                    }
                ],
                api: [
                    {
                        id: 'api-1',
                        title: 'Standardize Error Responses',
                        impact: 'medium',
                        effort: 'low',
                        time: '2-3 hours',
                        sprint: 1,
                        files: ['utils/exceptions.py (new)', 'syra/settings.py'],
                        steps: [
                            'Create custom exception handler',
                            'Define standard error format',
                            'Update REST_FRAMEWORK settings',
                            'Test all error scenarios'
                        ]
                    },
                    {
                        id: 'api-2',
                        title: 'Implement API Versioning',
                        impact: 'medium',
                        effort: 'medium',
                        time: '4-6 hours',
                        sprint: 2,
                        files: ['api/v1/urls.py (new)', 'syra/urls.py'],
                        steps: [
                            'Create versioned URL structure',
                            'Move current endpoints to v1',
                            'Set up router configuration',
                            'Update API documentation'
                        ]
                    },
                    {
                        id: 'api-3',
                        title: 'Add Proper Pagination',
                        impact: 'medium',
                        effort: 'low',
                        time: '2-3 hours',
                        sprint: 2,
                        files: ['syra/settings.py', 'utils/pagination.py (new)'],
                        steps: [
                            'Configure default pagination',
                            'Create custom pagination classes',
                            'Apply to all list endpoints',
                            'Test with large datasets'
                        ]
                    },
                    {
                        id: 'api-4',
                        title: 'Add Rate Limiting',
                        impact: 'high',
                        effort: 'medium',
                        time: '3-4 hours',
                        sprint: 3,
                        files: ['syra/settings.py', 'profiles/views.py (emergency endpoint)'],
                        steps: [
                            'Install django-ratelimit',
                            'Configure rate limits per endpoint',
                            'Add special handling for emergency scan',
                            'Test abuse scenarios'
                        ]
                    }
                ],
                database: [
                    {
                        id: 'db-1',
                        title: 'Add Missing Indexes',
                        impact: 'high',
                        effort: 'low',
                        time: '2-3 hours',
                        sprint: 1,
                        files: ['All models.py files'],
                        steps: [
                            'Analyze query patterns',
                            'Add indexes to frequently filtered fields',
                            'Add composite indexes',
                            'Run migrations'
                        ]
                    },
                    {
                        id: 'db-2',
                        title: 'Optimize Serializer Queries',
                        impact: 'high',
                        effort: 'medium',
                        time: '4-6 hours',
                        sprint: 2,
                        files: ['All serializers.py files'],
                        steps: [
                            'Update get_queryset in ViewSets',
                            'Add select_related for nested serializers',
                            'Add prefetch_related for list fields',
                            'Benchmark query counts'
                        ]
                    },
                    {
                        id: 'db-3',
                        title: 'Add Database Constraints',
                        impact: 'medium',
                        effort: 'medium',
                        time: '4-5 hours',
                        sprint: 3,
                        files: ['store/models.py', 'profiles/models.py'],
                        steps: [
                            'Add unique constraints where needed',
                            'Add check constraints for business rules',
                            'Add NOT NULL constraints',
                            'Write data migration if needed'
                        ]
                    }
                ],
                security: [
                    {
                        id: 'sec-1',
                        title: 'Add CSRF Tokens to Forms',
                        impact: 'critical',
                        effort: 'low',
                        time: '30 minutes',
                        sprint: 1,
                        files: ['templates/store/analytics.html', 'templates/store/band_list.html', 'templates/profiles/doctor_portal.html'],
                        steps: [
                            'Add {% csrf_token %} to each form',
                            'Test form submissions',
                            'Verify CSRF middleware is active'
                        ]
                    },
                    {
                        id: 'sec-2',
                        title: 'Remove Hardcoded Passwords',
                        impact: 'critical',
                        effort: 'low',
                        time: '1 hour',
                        sprint: 1,
                        files: ['store/tests.py', 'accounts/tests.py', 'profiles/tests.py'],
                        steps: [
                            'Use Django test utilities',
                            'Implement factory pattern',
                            'Use environment variables for test data'
                        ]
                    },
                    {
                        id: 'sec-3',
                        title: 'Review AllowAny Permissions',
                        impact: 'high',
                        effort: 'medium',
                        time: '3-4 hours',
                        sprint: 2,
                        files: ['19 locations across views.py files'],
                        steps: [
                            'Audit each AllowAny usage',
                            'Replace with appropriate permissions',
                            'Add IsAuthenticatedOrReadOnly where needed',
                            'Test authentication flows'
                        ]
                    },
                    {
                        id: 'sec-4',
                        title: 'Implement Rate Limiting',
                        impact: 'high',
                        effort: 'medium',
                        time: '3-4 hours',
                        sprint: 2,
                        files: ['Emergency scan endpoint', 'Authentication endpoints'],
                        steps: [
                            'Add rate limiting to emergency endpoint',
                            'Limit login attempts',
                            'Configure throttling in DRF',
                            'Add tests for rate limits'
                        ]
                    }
                ],
                frontend: [
                    {
                        id: 'fe-1',
                        title: 'Update Color Palette',
                        impact: 'high',
                        effort: 'low',
                        time: '2-3 hours',
                        sprint: 1,
                        files: ['templates/base.html'],
                        steps: [
                            'Add new color variables',
                            'Update Tailwind config',
                            'Replace gradient backgrounds',
                            'Test color contrast ratios'
                        ]
                    },
                    {
                        id: 'fe-2',
                        title: 'Add Google Fonts (Inter)',
                        impact: 'medium',
                        effort: 'low',
                        time: '1 hour',
                        sprint: 1,
                        files: ['templates/base.html'],
                        steps: [
                            'Add Google Fonts link',
                            'Update font-family declarations',
                            'Test on different browsers'
                        ]
                    },
                    {
                        id: 'fe-3',
                        title: 'Redesign Dashboard Cards',
                        impact: 'high',
                        effort: 'medium',
                        time: '4-6 hours',
                        sprint: 2,
                        files: ['templates/profiles/dashboard.html'],
                        steps: [
                            'Apply new card design',
                            'Add glassmorphism effects',
                            'Implement hover animations',
                            'Test responsive behavior'
                        ]
                    },
                    {
                        id: 'fe-4',
                        title: 'Optimize Emergency Scan Page',
                        impact: 'critical',
                        effort: 'medium',
                        time: '6-8 hours',
                        sprint: 2,
                        files: ['templates/profiles/emergency_scan.html'],
                        steps: [
                            'Redesign for 3-second comprehension',
                            'Enlarge critical info (blood type)',
                            'Add pulsing animations for alerts',
                            'Optimize mobile layout',
                            'Test with paramedics'
                        ]
                    },
                    {
                        id: 'fe-5',
                        title: 'Add Micro-Interactions',
                        impact: 'medium',
                        effort: 'medium',
                        time: '4-6 hours',
                        sprint: 3,
                        files: ['templates/base.html (CSS)', 'All templates'],
                        steps: [
                            'Add button hover effects',
                            'Add loading animations',
                            'Add success/error feedback',
                            'Test performance impact'
                        ]
                    },
                    {
                        id: 'fe-6',
                        title: 'Implement Dark Mode',
                        impact: 'medium',
                        effort: 'high',
                        time: '8-10 hours',
                        sprint: 4,
                        files: ['templates/base.html', 'All templates'],
                        steps: [
                            'Add dark mode toggle',
                            'Define dark color palette',
                            'Update all components',
                            'Test contrast ratios'
                        ]
                    }
                ],
                testing: [
                    {
                        id: 'test-1',
                        title: 'Set Up Test Factories',
                        impact: 'high',
                        effort: 'medium',
                        time: '4-6 hours',
                        sprint: 3,
                        files: ['tests/factories.py (new)'],
                        steps: [
                            'Install factory_boy',
                            'Create factories for all models',
                            'Update existing tests to use factories',
                            'Document factory usage'
                        ]
                    },
                    {
                        id: 'test-2',
                        title: 'Write API Tests',
                        impact: 'high',
                        effort: 'high',
                        time: '12-16 hours',
                        sprint: 3,
                        files: ['tests/test_api.py', 'tests/test_authentication.py'],
                        steps: [
                            'Test all CRUD endpoints',
                            'Test authentication flows',
                            'Test permission classes',
                            'Test error responses'
                        ]
                    },
                    {
                        id: 'test-3',
                        title: 'Improve Test Coverage to 85%',
                        impact: 'high',
                        effort: 'high',
                        time: '16-20 hours',
                        sprint: 4,
                        files: ['All test files'],
                        steps: [
                            'Run coverage report',
                            'Identify uncovered code',
                            'Write tests for critical paths',
                            'Set up coverage in CI/CD'
                        ]
                    }
                ]
            };

            // Calculate sprint summaries
            const getSprints = () => {
                const sprints = [
                    { number: 1, name: 'Sprint 1: Quick Wins & Critical Fixes', duration: '1 week', focus: 'Security + Performance' },
                    { number: 2, name: 'Sprint 2: Architecture & API', duration: '2 weeks', focus: 'Refactoring + Front-end' },
                    { number: 3, name: 'Sprint 3: Service Layer & Testing', duration: '2 weeks', focus: 'Code Quality + Tests' },
                    { number: 4, name: 'Sprint 4: Polish & Monitoring', duration: '1 week', focus: 'Final Touches' }
                ];

                return sprints.map(sprint => {
                    const sprintTasks = Object.values(tasks).flat().filter(t => t.sprint === sprint.number);
                    const totalTime = sprintTasks.reduce((acc, task) => {
                        const hours = task.time.match(/\d+/g).map(Number);
                        return acc + (hours.reduce((a, b) => a + b) / hours.length);
                    }, 0);

                    return {
                        ...sprint,
                        tasks: sprintTasks,
                        totalHours: Math.round(totalTime),
                        criticalCount: sprintTasks.filter(t => t.impact === 'critical').length,
                        highCount: sprintTasks.filter(t => t.impact === 'high').length
                    };
                });
            };

            const sprints = getSprints();

            const toggleTask = (taskId) => {
                setCompletedTasks(prev => ({
                    ...prev,
                    [taskId]: !prev[taskId]
                }));
            };

            const getImpactColor = (impact) => {
                const colors = {
                    critical: 'bg-red-100 text-red-800 border-red-300',
                    high: 'bg-orange-100 text-orange-800 border-orange-300',
                    medium: 'bg-yellow-100 text-yellow-800 border-yellow-300',
                    low: 'bg-green-100 text-green-800 border-green-300'
                };
                return colors[impact];
            };

            const getEffortBadge = (effort) => {
                const badges = {
                    low: '🟢 Low',
                    medium: '🟡 Medium',
                    high: '🔴 High'
                };
                return badges[effort];
            };

            const currentSprint = sprints.find(s => s.number === selectedSprint);

            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-50 to-blue-50">
                    {/* Header */}
                    <header className="bg-white shadow-sm border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                            <h1 className="text-3xl font-bold text-gray-900">SYRA Refactoring Sprint Planner</h1>
                            <p className="text-gray-600 mt-1">Code Quality & Maintainability Roadmap</p>
                        </div>
                    </header>

                    {/* Sprint Tabs */}
                    <div className="bg-white border-b border-gray-200 sticky top-0 z-10 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex space-x-1 overflow-x-auto">
                                {sprints.map(sprint => (
                                    <button
                                        key={sprint.number}
                                        onClick={() => setSelectedSprint(sprint.number)}
                                        className={`px-6 py-4 font-medium text-sm whitespace-nowrap transition-colors border-b-2 ${
                                            selectedSprint === sprint.number
                                                ? 'border-blue-500 text-blue-600 bg-blue-50'
                                                : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                                        }`}
                                    >
                                        <div>
                                            <div className="font-bold">Sprint {sprint.number}</div>
                                            <div className="text-xs text-gray-500">{sprint.duration} • {sprint.totalHours}h</div>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {/* Sprint Overview */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-8">
                            <h2 className="text-2xl font-bold text-gray-900 mb-2">{currentSprint.name}</h2>
                            <p className="text-gray-600 mb-4">Focus: {currentSprint.focus}</p>
                            
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <div className="bg-gradient-to-br from-blue-50 to-blue-100 rounded-lg p-4 border border-blue-200">
                                    <div className="text-sm text-blue-600 font-medium mb-1">Total Tasks</div>
                                    <div className="text-3xl font-bold text-blue-900">{currentSprint.tasks.length}</div>
                                </div>
                                <div className="bg-gradient-to-br from-orange-50 to-orange-100 rounded-lg p-4 border border-orange-200">
                                    <div className="text-sm text-orange-600 font-medium mb-1">Estimated Hours</div>
                                    <div className="text-3xl font-bold text-orange-900">{currentSprint.totalHours}h</div>
                                </div>
                                <div className="bg-gradient-to-br from-red-50 to-red-100 rounded-lg p-4 border border-red-200">
                                    <div className="text-sm text-red-600 font-medium mb-1">Critical Items</div>
                                    <div className="text-3xl font-bold text-red-900">{currentSprint.criticalCount}</div>
                                </div>
                                <div className="bg-gradient-to-br from-green-50 to-green-100 rounded-lg p-4 border border-green-200">
                                    <div className="text-sm text-green-600 font-medium mb-1">Completed</div>
                                    <div className="text-3xl font-bold text-green-900">
                                        {currentSprint.tasks.filter(t => completedTasks[t.id]).length}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Tasks by Category */}
                        {Object.entries(tasks).map(([category, categoryTasks]) => {
                            const sprintTasks = categoryTasks.filter(t => t.sprint === selectedSprint);
                            if (sprintTasks.length === 0) return null;

                            return (
                                <div key={category} className="mb-8">
                                    <h3 className="text-xl font-bold text-gray-900 mb-4 capitalize flex items-center gap-2">
                                        <span className="bg-blue-100 text-blue-800 px-3 py-1 rounded-lg text-sm">
                                            {category}
                                        </span>
                                        <span className="text-gray-500 text-sm font-normal">
                                            ({sprintTasks.length} tasks)
                                        </span>
                                    </h3>

                                    <div className="space-y-4">
                                        {sprintTasks.map(task => {
                                            const isCompleted = completedTasks[task.id];
                                            
                                            return (
                                                <div 
                                                    key={task.id}
                                                    className={`bg-white rounded-xl shadow-sm border-2 p-6 transition-all ${
                                                        isCompleted 
                                                            ? 'border-green-300 bg-green-50' 
                                                            : 'border-gray-200 hover:border-blue-300'
                                                    }`}
                                                >
                                                    <div className="flex items-start gap-4">
                                                        <input
                                                            type="checkbox"
                                                            checked={isCompleted || false}
                                                            onChange={() => toggleTask(task.id)}
                                                            className="mt-1 h-6 w-6 rounded border-gray-300 text-blue-600 focus:ring-blue-500"
                                                        />
                                                        
                                                        <div className="flex-1">
                                                            <div className="flex items-start justify-between mb-3">
                                                                <div className="flex-1">
                                                                    <h4 className={`text-lg font-semibold ${isCompleted ? 'line-through text-gray-500' : 'text-gray-900'}`}>
                                                                        {task.title}
                                                                    </h4>
                                                                    <div className="flex items-center gap-2 mt-1">
                                                                        <span className={`px-2 py-1 rounded text-xs font-semibold border ${getImpactColor(task.impact)}`}>
                                                                            {task.impact.toUpperCase()}
                                                                        </span>
                                                                        <span className="text-sm text-gray-600">
                                                                            {getEffortBadge(task.effort)}
                                                                        </span>
                                                                        <span className="text-sm text-gray-500">
                                                                            • {task.time}
                                                                        </span>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            {/* Files */}
                                                            <div className="mb-3">
                                                                <div className="text-sm font-medium text-gray-700 mb-2">📁 Files to modify:</div>
                                                                <div className="space-y-1">
                                                                    {task.files.map((file, idx) => (
                                                                        <div key={idx} className="text-sm text-gray-600 font-mono bg-gray-50 px-2 py-1 rounded">
                                                                            {file}
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>

                                                            {/* Steps */}
                                                            <div>
                                                                <div className="text-sm font-medium text-gray-700 mb-2">✓ Implementation steps:</div>
                                                                <ol className="space-y-1">
                                                                    {task.steps.map((step, idx) => (
                                                                        <li key={idx} className="text-sm text-gray-600 flex items-start gap-2">
                                                                            <span className="text-blue-600 font-semibold">{idx + 1}.</span>
                                                                            <span>{step}</span>
                                                                        </li>
                                                                    ))}
                                                                </ol>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            );
                        })}

                        {/* Export Button */}
                        <div className="text-center mt-8">
                            <button
                                onClick={() => {
                                    const report = {
                                        sprint: selectedSprint,
                                        tasks: currentSprint.tasks,
                                        completed: completedTasks,
                                        timestamp: new Date().toISOString()
                                    };
                                    const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
                                    const url = URL.createObjectURL(blob);
                                    const a = document.createElement('a');
                                    a.href = url;
                                    a.download = `syra-sprint-${selectedSprint}-${new Date().toISOString().split('T')[0]}.json`;
                                    a.click();
                                }}
                                className="px-6 py-3 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition-colors shadow-lg"
                            >
                                📥 Export Sprint Plan
                            </button>
                        </div>
                    </main>
                </div>
            );
        };

        ReactDOM.render(<SprintPlanner />, document.getElementById('root'));
    </script>
</body>
</html>
