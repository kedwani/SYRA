<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYRA Code Review Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        const CodeReviewDashboard = () => {
            const [activeTab, setActiveTab] = useState('automated');
            const [selectedCategory, setSelectedCategory] = useState('all');
            const [completedChecks, setCompletedChecks] = useState({});
            const [automatedResults, setAutomatedResults] = useState(null);
            const [scanning, setScanning] = useState(false);

            // Manual review checklist organized by category
            const manualChecks = {
                security: [
                    {
                        id: 'sec-1',
                        title: 'Authentication & Authorization',
                        items: [
                            'All API endpoints have proper permission classes (IsAuthenticated, AllowAny, etc.)',
                            'JWT tokens are properly validated and refreshed',
                            'User permissions are checked before data access',
                            'No sensitive data in URLs or query parameters',
                            'Password fields use proper validation and hashing'
                        ],
                        priority: 'critical'
                    },
                    {
                        id: 'sec-2',
                        title: 'Data Privacy (Medical Data)',
                        items: [
                            'Insurance images are encrypted at rest (Fernet)',
                            'Emergency scan endpoints exclude sensitive data (National ID, insurance)',
                            'UUID is used for public profile access (not sequential IDs)',
                            'Privacy controls (show_*_public fields) are respected in all views',
                            'Access logging is implemented for premium users'
                        ],
                        priority: 'critical'
                    },
                    {
                        id: 'sec-3',
                        title: 'Input Validation & Sanitization',
                        items: [
                            'All user inputs are validated (serializers, form validators)',
                            'File uploads have proper extension and size validation',
                            'SQL injection protection (using ORM, no raw queries)',
                            'XSS protection in templates (auto-escaping enabled)',
                            'CSRF tokens present in all forms'
                        ],
                        priority: 'high'
                    },
                    {
                        id: 'sec-4',
                        title: 'Rate Limiting & Abuse Prevention',
                        items: [
                            'Rate limiting on authentication endpoints',
                            'Emergency scan endpoint has abuse prevention',
                            'API throttling configured in DRF settings',
                            'Account lockout after failed login attempts'
                        ],
                        priority: 'medium'
                    }
                ],
                backend: [
                    {
                        id: 'be-1',
                        title: 'Models & Database',
                        items: [
                            'Proper indexing on frequently queried fields (public_id, user FK)',
                            'Cascade delete rules are appropriate',
                            'No N+1 queries (use select_related, prefetch_related)',
                            'Database migrations are reversible',
                            'Model methods have docstrings'
                        ],
                        priority: 'high'
                    },
                    {
                        id: 'be-2',
                        title: 'Views & API Design',
                        items: [
                            'ViewSets use appropriate queryset filtering (user-specific data)',
                            'Proper HTTP status codes returned',
                            'Error handling with informative messages',
                            'Serializer validation in perform_create/update',
                            'API versioning strategy in place'
                        ],
                        priority: 'high'
                    },
                    {
                        id: 'be-3',
                        title: 'Business Logic & Data Integrity',
                        items: [
                            'Emergency contacts limited to 2 per profile (validated)',
                            'Medication dates validated (start_date before end_date)',
                            'National ID validation (14 digits, proper format)',
                            'Blood type choices enforced',
                            'Profile auto-creation via signals working correctly'
                        ],
                        priority: 'medium'
                    },
                    {
                        id: 'be-4',
                        title: 'Performance',
                        items: [
                            'Queryset optimization (avoid fetching unnecessary data)',
                            'Proper caching strategy for static data',
                            'Image optimization for uploaded files',
                            'Database connection pooling configured',
                            'Lazy loading implemented where appropriate'
                        ],
                        priority: 'medium'
                    }
                ],
                frontend: [
                    {
                        id: 'fe-1',
                        title: 'Templates & UI',
                        items: [
                            'Mobile-responsive design (tested on multiple devices)',
                            'Proper error handling and user feedback',
                            'Loading states for HTMX requests',
                            'Accessibility: ARIA labels, keyboard navigation',
                            'Consistent styling across all pages'
                        ],
                        priority: 'high'
                    },
                    {
                        id: 'fe-2',
                        title: 'JavaScript & Interactivity',
                        items: [
                            'HTMX requests have proper error handling',
                            'Alpine.js state management is clean',
                            'No console errors in browser',
                            'Form validation before submission',
                            'Click-to-call links work on mobile'
                        ],
                        priority: 'medium'
                    },
                    {
                        id: 'fe-3',
                        title: 'UX & User Flow',
                        items: [
                            'Emergency scan page loads fast (critical path)',
                            'Clear navigation and breadcrumbs',
                            'Success/error messages are clear',
                            'QR code generation works reliably',
                            'Doctor portal has proper access controls'
                        ],
                        priority: 'high'
                    }
                ],
                testing: [
                    {
                        id: 'test-1',
                        title: 'Test Coverage',
                        items: [
                            'Unit tests for models (871 lines in store/tests.py)',
                            'API endpoint tests (authentication, CRUD)',
                            'Edge cases tested (empty data, invalid inputs)',
                            'Integration tests for critical flows',
                            'Test coverage > 80% for critical modules'
                        ],
                        priority: 'high'
                    },
                    {
                        id: 'test-2',
                        title: 'Quality Checks',
                        items: [
                            'All tests pass in CI/CD pipeline',
                            'No flaky tests',
                            'Test data cleanup after each test',
                            'Performance tests for API endpoints',
                            'Security tests (penetration testing)'
                        ],
                        priority: 'medium'
                    }
                ],
                code_quality: [
                    {
                        id: 'cq-1',
                        title: 'Code Style & Standards',
                        items: [
                            'PEP 8 compliance (linting with flake8/black)',
                            'Consistent naming conventions',
                            'Functions/methods are single-purpose',
                            'No commented-out code',
                            'Proper docstrings for classes/functions'
                        ],
                        priority: 'medium'
                    },
                    {
                        id: 'cq-2',
                        title: 'Documentation',
                        items: [
                            'README is up to date',
                            'API documentation (DRF spectacular)',
                            'Environment variables documented',
                            'Setup instructions are clear',
                            'Architecture decisions documented (ADRs)'
                        ],
                        priority: 'medium'
                    },
                    {
                        id: 'cq-3',
                        title: 'Maintainability',
                        items: [
                            'No code duplication (DRY principle)',
                            'Large files broken into logical modules',
                            'Dependencies are up to date',
                            'No unused imports or variables',
                            'Error logging is comprehensive'
                        ],
                        priority: 'low'
                    }
                ]
            };

            // Automated checks simulation
            const runAutomatedChecks = () => {
                setScanning(true);
                
                // Simulate automated scanning
                setTimeout(() => {
                    setAutomatedResults({
                        security: {
                            score: 85,
                            issues: [
                                { severity: 'medium', message: 'Consider adding rate limiting to emergency scan endpoint', file: 'profiles/views.py', line: 95 },
                                { severity: 'low', message: 'Add CORS configuration for production', file: 'syra/settings.py', line: 45 }
                            ]
                        },
                        performance: {
                            score: 78,
                            issues: [
                                { severity: 'high', message: 'N+1 query detected in medications list view', file: 'profiles/template_views.py', line: 234 },
                                { severity: 'medium', message: 'Missing select_related in emergency contacts query', file: 'profiles/views.py', line: 72 }
                            ]
                        },
                        code_quality: {
                            score: 92,
                            issues: [
                                { severity: 'low', message: 'Large function detected (> 50 lines)', file: 'store/views.py', line: 156 },
                                { severity: 'low', message: 'Missing type hints', file: 'profiles/models.py', line: 12 }
                            ]
                        },
                        tests: {
                            score: 88,
                            coverage: 87,
                            issues: [
                                { severity: 'medium', message: 'Missing tests for emergency_alerts.py', file: 'profiles/emergency_alerts.py' }
                            ]
                        }
                    });
                    setScanning(false);
                }, 2000);
            };

            useEffect(() => {
                runAutomatedChecks();
            }, []);

            const toggleCheck = (checkId) => {
                setCompletedChecks(prev => ({
                    ...prev,
                    [checkId]: !prev[checkId]
                }));
            };

            const getCategoryColor = (category) => {
                const colors = {
                    security: 'text-red-600 bg-red-50 border-red-200',
                    backend: 'text-blue-600 bg-blue-50 border-blue-200',
                    frontend: 'text-purple-600 bg-purple-50 border-purple-200',
                    testing: 'text-green-600 bg-green-50 border-green-200',
                    code_quality: 'text-amber-600 bg-amber-50 border-amber-200'
                };
                return colors[category] || 'text-gray-600 bg-gray-50 border-gray-200';
            };

            const getPriorityBadge = (priority) => {
                const badges = {
                    critical: 'bg-red-100 text-red-800 border border-red-200',
                    high: 'bg-orange-100 text-orange-800 border border-orange-200',
                    medium: 'bg-yellow-100 text-yellow-800 border border-yellow-200',
                    low: 'bg-green-100 text-green-800 border border-green-200'
                };
                return badges[priority] || badges.medium;
            };

            const getSeverityColor = (severity) => {
                const colors = {
                    high: 'text-red-600',
                    medium: 'text-orange-600',
                    low: 'text-yellow-600'
                };
                return colors[severity] || 'text-gray-600';
            };

            const getScoreColor = (score) => {
                if (score >= 90) return 'text-green-600';
                if (score >= 75) return 'text-yellow-600';
                return 'text-red-600';
            };

            const calculateProgress = () => {
                let totalChecks = 0;
                let completedCount = 0;
                
                Object.values(manualChecks).forEach(categoryGroups => {
                    categoryGroups.forEach(group => {
                        group.items.forEach((_, idx) => {
                            totalChecks++;
                            const checkId = `${group.id}-${idx}`;
                            if (completedChecks[checkId]) completedCount++;
                        });
                    });
                });
                
                return { totalChecks, completedCount, percentage: Math.round((completedCount / totalChecks) * 100) };
            };

            const progress = calculateProgress();

            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100">
                    {/* Header */}
                    <header className="bg-white shadow-sm border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                            <div className="flex items-center justify-between">
                                <div>
                                    <h1 className="text-3xl font-bold text-gray-900">SYRA Code Review Dashboard</h1>
                                    <p className="text-gray-600 mt-1">Automated checks + Manual review checklist</p>
                                </div>
                                <div className="text-right">
                                    <div className="text-sm text-gray-500">Overall Progress</div>
                                    <div className="text-3xl font-bold text-blue-600">{progress.percentage}%</div>
                                    <div className="text-xs text-gray-500">{progress.completedCount} / {progress.totalChecks} completed</div>
                                </div>
                            </div>
                            
                            {/* Progress Bar */}
                            <div className="mt-4 bg-gray-200 rounded-full h-3 overflow-hidden">
                                <div 
                                    className="bg-gradient-to-r from-blue-500 to-blue-600 h-full transition-all duration-500"
                                    style={{ width: `${progress.percentage}%` }}
                                />
                            </div>
                        </div>
                    </header>

                    {/* Tabs */}
                    <div className="bg-white border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex space-x-8">
                                <button
                                    onClick={() => setActiveTab('automated')}
                                    className={`py-4 px-1 border-b-2 font-medium text-sm transition-colors ${
                                        activeTab === 'automated'
                                            ? 'border-blue-500 text-blue-600'
                                            : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                                    }`}
                                >
                                    🤖 Automated Checks
                                </button>
                                <button
                                    onClick={() => setActiveTab('manual')}
                                    className={`py-4 px-1 border-b-2 font-medium text-sm transition-colors ${
                                        activeTab === 'manual'
                                            ? 'border-blue-500 text-blue-600'
                                            : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                                    }`}
                                >
                                    ✅ Manual Review
                                </button>
                                <button
                                    onClick={() => setActiveTab('summary')}
                                    className={`py-4 px-1 border-b-2 font-medium text-sm transition-colors ${
                                        activeTab === 'summary'
                                            ? 'border-blue-500 text-blue-600'
                                            : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                                    }`}
                                >
                                    📊 Summary
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        
                        {/* Automated Tab */}
                        {activeTab === 'automated' && (
                            <div>
                                {scanning ? (
                                    <div className="text-center py-12">
                                        <div className="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-200 border-t-blue-600"></div>
                                        <p className="mt-4 text-gray-600">Scanning codebase...</p>
                                    </div>
                                ) : automatedResults && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        {/* Security Score */}
                                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                            <div className="flex items-center justify-between mb-4">
                                                <h3 className="text-lg font-semibold text-gray-900">🔒 Security</h3>
                                                <span className={`text-3xl font-bold ${getScoreColor(automatedResults.security.score)}`}>
                                                    {automatedResults.security.score}
                                                </span>
                                            </div>
                                            <div className="space-y-3">
                                                {automatedResults.security.issues.map((issue, idx) => (
                                                    <div key={idx} className="p-3 bg-gray-50 rounded-lg border border-gray-200">
                                                        <div className="flex items-start gap-2">
                                                            <span className={`text-sm font-semibold ${getSeverityColor(issue.severity)}`}>
                                                                {issue.severity.toUpperCase()}
                                                            </span>
                                                        </div>
                                                        <p className="text-sm text-gray-700 mt-1">{issue.message}</p>
                                                        <p className="text-xs text-gray-500 mt-1">{issue.file}:{issue.line}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Performance Score */}
                                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                            <div className="flex items-center justify-between mb-4">
                                                <h3 className="text-lg font-semibold text-gray-900">⚡ Performance</h3>
                                                <span className={`text-3xl font-bold ${getScoreColor(automatedResults.performance.score)}`}>
                                                    {automatedResults.performance.score}
                                                </span>
                                            </div>
                                            <div className="space-y-3">
                                                {automatedResults.performance.issues.map((issue, idx) => (
                                                    <div key={idx} className="p-3 bg-gray-50 rounded-lg border border-gray-200">
                                                        <div className="flex items-start gap-2">
                                                            <span className={`text-sm font-semibold ${getSeverityColor(issue.severity)}`}>
                                                                {issue.severity.toUpperCase()}
                                                            </span>
                                                        </div>
                                                        <p className="text-sm text-gray-700 mt-1">{issue.message}</p>
                                                        <p className="text-xs text-gray-500 mt-1">{issue.file}:{issue.line}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Code Quality Score */}
                                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                            <div className="flex items-center justify-between mb-4">
                                                <h3 className="text-lg font-semibold text-gray-900">💎 Code Quality</h3>
                                                <span className={`text-3xl font-bold ${getScoreColor(automatedResults.code_quality.score)}`}>
                                                    {automatedResults.code_quality.score}
                                                </span>
                                            </div>
                                            <div className="space-y-3">
                                                {automatedResults.code_quality.issues.map((issue, idx) => (
                                                    <div key={idx} className="p-3 bg-gray-50 rounded-lg border border-gray-200">
                                                        <div className="flex items-start gap-2">
                                                            <span className={`text-sm font-semibold ${getSeverityColor(issue.severity)}`}>
                                                                {issue.severity.toUpperCase()}
                                                            </span>
                                                        </div>
                                                        <p className="text-sm text-gray-700 mt-1">{issue.message}</p>
                                                        <p className="text-xs text-gray-500 mt-1">{issue.file}:{issue.line}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Test Coverage */}
                                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                            <div className="flex items-center justify-between mb-4">
                                                <h3 className="text-lg font-semibold text-gray-900">🧪 Tests</h3>
                                                <span className={`text-3xl font-bold ${getScoreColor(automatedResults.tests.score)}`}>
                                                    {automatedResults.tests.score}
                                                </span>
                                            </div>
                                            <div className="mb-4">
                                                <div className="flex justify-between text-sm mb-2">
                                                    <span className="text-gray-600">Code Coverage</span>
                                                    <span className="font-semibold text-gray-900">{automatedResults.tests.coverage}%</span>
                                                </div>
                                                <div className="bg-gray-200 rounded-full h-2">
                                                    <div 
                                                        className="bg-green-500 h-2 rounded-full"
                                                        style={{ width: `${automatedResults.tests.coverage}%` }}
                                                    />
                                                </div>
                                            </div>
                                            <div className="space-y-3">
                                                {automatedResults.tests.issues.map((issue, idx) => (
                                                    <div key={idx} className="p-3 bg-gray-50 rounded-lg border border-gray-200">
                                                        <div className="flex items-start gap-2">
                                                            <span className={`text-sm font-semibold ${getSeverityColor(issue.severity)}`}>
                                                                {issue.severity.toUpperCase()}
                                                            </span>
                                                        </div>
                                                        <p className="text-sm text-gray-700 mt-1">{issue.message}</p>
                                                        <p className="text-xs text-gray-500 mt-1">{issue.file}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <div className="mt-8 bg-blue-50 border border-blue-200 rounded-xl p-6">
                                    <h4 className="font-semibold text-blue-900 mb-2">💡 Recommendations</h4>
                                    <ul className="space-y-2 text-sm text-blue-800">
                                        <li>• Focus on N+1 query optimization in profiles/template_views.py - this is impacting performance</li>
                                        <li>• Add rate limiting to emergency scan endpoint to prevent abuse</li>
                                        <li>• Increase test coverage for profiles/emergency_alerts.py module</li>
                                        <li>• Consider breaking large view files into smaller, focused modules</li>
                                    </ul>
                                </div>
                            </div>
                        )}

                        {/* Manual Review Tab */}
                        {activeTab === 'manual' && (
                            <div>
                                {/* Category Filter */}
                                <div className="mb-6 flex flex-wrap gap-2">
                                    <button
                                        onClick={() => setSelectedCategory('all')}
                                        className={`px-4 py-2 rounded-lg font-medium text-sm transition-colors ${
                                            selectedCategory === 'all'
                                                ? 'bg-blue-600 text-white'
                                                : 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50'
                                        }`}
                                    >
                                        All Categories
                                    </button>
                                    {Object.keys(manualChecks).map(category => (
                                        <button
                                            key={category}
                                            onClick={() => setSelectedCategory(category)}
                                            className={`px-4 py-2 rounded-lg font-medium text-sm transition-colors capitalize ${
                                                selectedCategory === category
                                                    ? getCategoryColor(category)
                                                    : 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50'
                                            }`}
                                        >
                                            {category.replace('_', ' ')}
                                        </button>
                                    ))}
                                </div>

                                {/* Checklist */}
                                <div className="space-y-6">
                                    {Object.entries(manualChecks)
                                        .filter(([category]) => selectedCategory === 'all' || selectedCategory === category)
                                        .map(([category, groups]) => (
                                            <div key={category}>
                                                <h3 className="text-xl font-bold text-gray-900 mb-4 capitalize flex items-center gap-2">
                                                    <span className={`px-3 py-1 rounded-lg text-sm ${getCategoryColor(category)}`}>
                                                        {category.replace('_', ' ')}
                                                    </span>
                                                </h3>
                                                
                                                <div className="space-y-4">
                                                    {groups.map(group => (
                                                        <div key={group.id} className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                                            <div className="flex items-start justify-between mb-4">
                                                                <div>
                                                                    <h4 className="text-lg font-semibold text-gray-900">{group.title}</h4>
                                                                </div>
                                                                <span className={`px-3 py-1 rounded-full text-xs font-semibold uppercase ${getPriorityBadge(group.priority)}`}>
                                                                    {group.priority}
                                                                </span>
                                                            </div>
                                                            
                                                            <div className="space-y-3">
                                                                {group.items.map((item, idx) => {
                                                                    const checkId = `${group.id}-${idx}`;
                                                                    const isChecked = completedChecks[checkId];
                                                                    
                                                                    return (
                                                                        <label
                                                                            key={idx}
                                                                            className={`flex items-start gap-3 p-3 rounded-lg border-2 cursor-pointer transition-all ${
                                                                                isChecked
                                                                                    ? 'bg-green-50 border-green-300'
                                                                                    : 'bg-gray-50 border-gray-200 hover:border-blue-300'
                                                                            }`}
                                                                        >
                                                                            <input
                                                                                type="checkbox"
                                                                                checked={isChecked || false}
                                                                                onChange={() => toggleCheck(checkId)}
                                                                                className="mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500"
                                                                            />
                                                                            <span className={`text-sm flex-1 ${isChecked ? 'line-through text-gray-500' : 'text-gray-700'}`}>
                                                                                {item}
                                                                            </span>
                                                                        </label>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                </div>
                            </div>
                        )}

                        {/* Summary Tab */}
                        {activeTab === 'summary' && (
                            <div className="space-y-6">
                                {/* Overall Stats */}
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                        <div className="text-sm text-gray-500 mb-2">Total Checks</div>
                                        <div className="text-3xl font-bold text-gray-900">{progress.totalChecks}</div>
                                    </div>
                                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                        <div className="text-sm text-gray-500 mb-2">Completed</div>
                                        <div className="text-3xl font-bold text-green-600">{progress.completedCount}</div>
                                    </div>
                                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                        <div className="text-sm text-gray-500 mb-2">Remaining</div>
                                        <div className="text-3xl font-bold text-orange-600">{progress.totalChecks - progress.completedCount}</div>
                                    </div>
                                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                        <div className="text-sm text-gray-500 mb-2">Progress</div>
                                        <div className="text-3xl font-bold text-blue-600">{progress.percentage}%</div>
                                    </div>
                                </div>

                                {/* Category Breakdown */}
                                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                    <h3 className="text-lg font-semibold text-gray-900 mb-4">Category Breakdown</h3>
                                    <div className="space-y-4">
                                        {Object.entries(manualChecks).map(([category, groups]) => {
                                            let categoryTotal = 0;
                                            let categoryCompleted = 0;
                                            
                                            groups.forEach(group => {
                                                group.items.forEach((_, idx) => {
                                                    categoryTotal++;
                                                    const checkId = `${group.id}-${idx}`;
                                                    if (completedChecks[checkId]) categoryCompleted++;
                                                });
                                            });
                                            
                                            const categoryPercentage = Math.round((categoryCompleted / categoryTotal) * 100);
                                            
                                            return (
                                                <div key={category}>
                                                    <div className="flex justify-between mb-2">
                                                        <span className="font-medium text-gray-900 capitalize">{category.replace('_', ' ')}</span>
                                                        <span className="text-sm text-gray-600">{categoryCompleted} / {categoryTotal}</span>
                                                    </div>
                                                    <div className="bg-gray-200 rounded-full h-3">
                                                        <div
                                                            className="bg-gradient-to-r from-blue-500 to-blue-600 h-3 rounded-full transition-all duration-500"
                                                            style={{ width: `${categoryPercentage}%` }}
                                                        />
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* Quick Actions */}
                                <div className="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-xl shadow-sm border border-blue-200 p-6">
                                    <h3 className="text-lg font-semibold text-gray-900 mb-4">🚀 Next Steps</h3>
                                    <div className="space-y-3">
                                        <div className="flex items-start gap-3">
                                            <div className="flex-shrink-0 w-6 h-6 bg-blue-600 text-white rounded-full flex items-center justify-center text-sm font-bold">1</div>
                                            <div>
                                                <div className="font-medium text-gray-900">Review Critical Security Items</div>
                                                <div className="text-sm text-gray-600">Focus on authentication, data privacy, and input validation</div>
                                            </div>
                                        </div>
                                        <div className="flex items-start gap-3">
                                            <div className="flex-shrink-0 w-6 h-6 bg-blue-600 text-white rounded-full flex items-center justify-center text-sm font-bold">2</div>
                                            <div>
                                                <div className="font-medium text-gray-900">Address Automated Check Issues</div>
                                                <div className="text-sm text-gray-600">Fix N+1 queries and add rate limiting</div>
                                            </div>
                                        </div>
                                        <div className="flex items-start gap-3">
                                            <div className="flex-shrink-0 w-6 h-6 bg-blue-600 text-white rounded-full flex items-center justify-center text-sm font-bold">3</div>
                                            <div>
                                                <div className="font-medium text-gray-900">Improve Test Coverage</div>
                                                <div className="text-sm text-gray-600">Target 90%+ coverage for critical modules</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Export Button */}
                                <div className="text-center">
                                    <button 
                                        onClick={() => {
                                            const report = {
                                                timestamp: new Date().toISOString(),
                                                progress: progress,
                                                automatedResults: automatedResults,
                                                completedChecks: completedChecks
                                            };
                                            const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
                                            const url = URL.createObjectURL(blob);
                                            const a = document.createElement('a');
                                            a.href = url;
                                            a.download = `syra-code-review-${new Date().toISOString().split('T')[0]}.json`;
                                            a.click();
                                        }}
                                        className="px-6 py-3 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition-colors shadow-lg"
                                    >
                                        📥 Export Review Report
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        ReactDOM.render(<CodeReviewDashboard />, document.getElementById('root'));
    </script>
</body>
</html>
